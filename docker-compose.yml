# ============================================================
# DEKUTCONNECT WhatsApp Bot — Docker Compose (VPS Deployment)
# Uses external Supabase PostgreSQL — no local database needed
# ============================================================

version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dekutconnect-bot
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Database is external (Supabase) — no local postgres needed
      - DATABASE_URL=${DATABASE_URL}
      # Session server (Vercel)
      - SESSION_SERVER_URL=${SESSION_SERVER_URL:-https://session.bot.connect.dekut.org}
      # Firebase command bridge
      - BOT_BRIDGE_ENABLED=${BOT_BRIDGE_ENABLED:-true}
      - BOT_UID=${BOT_UID}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-dekut-app-main}
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL:-https://dekut-app-main-default-rtdb.firebaseio.com}
      - FIREBASE_ADMIN_CREDENTIAL=${FIREBASE_ADMIN_CREDENTIAL}
    volumes:
      # Persist session data across container restarts
      - bot-session:/app/gift/session
      # Persist local SQLite database (fallback)
      - bot-database:/app/gift/database
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-5000}/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-session:
    driver: local
  bot-database:
    driver: local
