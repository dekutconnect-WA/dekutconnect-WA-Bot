<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>DEKUTCONNECT | Reset Your Password</title>
  <meta name="description" content="Reset your DEKUTCONNECT account password easily.">
  <meta name="theme-color" content="#8b5cf6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top right, #0e0725 0%, #030010 100%);
      color: #f3f4f6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Glass utilities ── */
    .glass-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    .glass-input {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: #fff;
      transition: all .3s ease;
    }
    .glass-input:focus {
      background: rgba(255,255,255,0.06);
      border-color: #a78bfa;
      box-shadow: 0 0 15px rgba(167,139,250,.2);
      outline: none;
    }

    /* ── Gradient utilities ── */
    .gradient-text {
      background: linear-gradient(135deg, #c084fc 0%, #818cf8 50%, #6366f1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .gradient-button {
      background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
      transition: all .3s ease;
    }
    .gradient-button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(139,92,246,.4); }

    /* ── Ambient blobs ── */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: .5;
    }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: rgba(30,20,60,.95);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      padding: 10px 20px;
      font-size: .8rem;
      color: #e9d5ff;
      z-index: 9999;
      transition: transform .3s ease;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body class="relative min-h-screen flex flex-col justify-center items-center p-5">

  <!-- Ambient Blobs -->
  <div class="blob w-96 h-96 bg-purple-700/20" style="top:-80px;left:-80px"></div>
  <div class="blob w-96 h-96 bg-indigo-700/20" style="bottom:40px;right:-80px"></div>

  <!-- Loading Overlay -->
  <div id="appLoader" class="fixed inset-0 z-50 bg-[#030010] flex flex-col items-center justify-center gap-4">
    <img src="https://i.postimg.cc/CxN0RKcD/dekutconnectdp.jpg" alt="DEKUTCONNECT" class="w-16 h-16 rounded-2xl shadow-xl animate-pulse">
    <div class="w-10 h-10 border-4 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
    <p class="text-purple-300 font-semibold tracking-wider text-sm">Initializing DEKUTCONNECT...</p>
  </div>

  <!-- Glass Card -->
  <div class="glass-card w-full max-w-md p-8 flex flex-col gap-6 relative z-10">
    <div class="text-center flex flex-col items-center gap-3">
      <img src="https://i.postimg.cc/CxN0RKcD/dekutconnectdp.jpg" alt="DEKUTCONNECT"
           class="w-16 h-16 rounded-2xl shadow-xl border border-purple-500/30 object-cover">
      <div>
        <h2 class="text-2xl font-bold gradient-text">Reset Your Password</h2>
        <p class="text-gray-400 text-xs mt-2">Enter your email address and we'll send you a link to reset your password.</p>
      </div>
    </div>

    <!-- Error/Success Message Area -->
    <div id="authMessage" class="hidden text-xs px-4 py-3 rounded-xl border"></div>

    <form id="resetForm" class="flex flex-col gap-4">
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1.5">Email Address</label>
        <input type="email" id="emailInput" required class="glass-input w-full px-4 py-3 text-sm" placeholder="you@example.com">
      </div>
      <button type="submit" id="resetSubmit" class="gradient-button text-white font-bold py-3.5 rounded-xl mt-1 text-sm cursor-pointer">
        Send Reset Link
      </button>
    </form>

    <div class="text-center mt-2">
      <a href="/index.html" class="text-purple-400 hover:text-purple-300 font-semibold text-xs transition">
        <i class="fas fa-arrow-left mr-1"></i> Back to Sign In
      </a>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <script>
    let auth = null;
    const appLoader = document.getElementById('appLoader');
    const resetForm = document.getElementById('resetForm');
    const emailInput = document.getElementById('emailInput');
    const resetSubmit = document.getElementById('resetSubmit');
    const authMessage = document.getElementById('authMessage');

    function showToast(msg, duration = 3000) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), duration);
    }

    function showFeedback(text, isSuccess) {
      authMessage.textContent = text;
      authMessage.classList.remove('hidden');
      if (isSuccess) {
        authMessage.className = "text-xs px-4 py-3 rounded-xl border border-green-500/30 bg-green-500/10 text-green-400";
      } else {
        authMessage.className = "text-xs px-4 py-3 rounded-xl border border-red-500/30 bg-red-500/10 text-red-400";
      }
    }

    const defaultFirebaseConfig = {
      apiKey: "AIzaSyDBpcfygHw2pCBrVtMp6dGeIRw2sCAC6TI",
      authDomain: "dekut-app-main.firebaseapp.com",
      projectId: "dekut-app-main",
      storageBucket: "dekut-app-main.firebasestorage.app",
      messagingSenderId: "227712751066",
      appId: "1:227712751066:web:1179019f15578e1de71ce3",
      measurementId: "G-1K8D7E0YZZ"
    };

    function _bootFirebase(cfg) {
      if (!firebase.apps.length) firebase.initializeApp(cfg);
      auth = firebase.auth();
      appLoader.classList.add('hidden');
    }

    // Load dynamic config or fallback
    const _cfgKey = '__dc_fbcfg';
    const _cachedCfg = sessionStorage.getItem(_cfgKey);
    if (_cachedCfg) {
      try { _bootFirebase(JSON.parse(_cachedCfg)); } catch { sessionStorage.removeItem(_cfgKey); }
    }
    if (!firebase.apps.length) {
      fetch('/api/firebase-config')
        .then(r => r.json())
        .then(cfg => {
          const merged = { ...defaultFirebaseConfig, ...cfg };
          sessionStorage.setItem(_cfgKey, JSON.stringify(merged));
          _bootFirebase(merged);
        })
        .catch(() => {
          console.warn('⚠️ Could not load remote Firebase config, using secure client defaults.');
          _bootFirebase(defaultFirebaseConfig);
        });
    }

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      if (!email) return;

      authMessage.classList.add('hidden');
      resetSubmit.disabled = true;
      resetSubmit.innerHTML = '<i class="fas fa-spinner animate-spin"></i> Sending...';

      try {
        await auth.sendPasswordResetEmail(email);
        showFeedback('🔑 Password reset link has been sent to your email! Check your inbox.', true);
        showToast('📧 Reset email sent successfully!');
      } catch (err) {
        showFeedback('❌ ' + friendlyAuthError(err.code), false);
      } finally {
        resetSubmit.disabled = false;
        resetSubmit.textContent = 'Send Reset Link';
      }
    });

    function friendlyAuthError(code) {
      const map = {
        'auth/invalid-email': 'Please enter a valid email address.',
        'auth/user-not-found': 'No account found with this email.',
        'auth/too-many-requests': 'Too many attempts. Please wait a moment.',
        'auth/network-request-failed': 'Network error. Check your connection.',
      };
      return map[code] || 'Failed to send reset link. Please try again.';
    }
  </script>

  <!-- Tailwind (utility classes only) -->
  <script src="https://cdn.tailwindcss.com"></script>
</body>
</html>
